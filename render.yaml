services:
  - type: web
    name: grc-erp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false   # تتحط يدويًا في لوحة Render (رابط Supabase)
      - key: NODE_VERSION
        value: 22
