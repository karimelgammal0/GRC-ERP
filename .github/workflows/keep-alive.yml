name: Keep alive
# بيدخل على البرنامج كل 10 دقايق: Render ميناموش، وSupabase يفضل صاحي (الطلب بيلمس القاعدة)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL غير مضبوط"; exit 0; fi
          curl -fsS --retry 3 --max-time 90 "$APP_URL/api/health"
